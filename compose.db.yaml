name: power-dashboard-dev

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${PGDATABASE:-power_dashboard}
      POSTGRES_USER: ${PGUSER:-power_dashboard}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
